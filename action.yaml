---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# sonatype-lifecycle-scan-action
name: '🔐 Sonatype Lifecycle Scan'
description: 'Runs a Sonatype Lifecycle (Nexus IQ) scan'

inputs:
  # Note: types are not enforced for composite actions and fail schema checks
  # But are useful for documentation purposes and will be commented out

  # Mandatory
  nexus_iq_server:
    description: 'Nexus IQ Server URL'
    required: true
    # type: string
  nexus_iq_username:
    description: 'Nexus IQ Username'
    required: true
    # type: string
  nexus_iq_password:
    description: 'Nexus IQ Password'
    required: true
    # type: string

  # Optional
  no_checkout:
    description: 'Do not checkout local repository; used for testing'
    required: false
    default: 'false'
    # type: boolean
  java_distribution:
    description: 'JAVA SE distribution to setup/run for Nexus CLI tool'
    required: false
    default: 'temurin'
    # type: string
  java_version:
    description: 'Java runtime to setup/run for Nexus CLI tool'
    required: false
    default: '17'
    # type: number
  iq_cli_version:
    description: 'Specific version of Nexus CLI to setup/run'
    required: false
    # Note: the 'latest' alias resolves to the version embedded in the
    # sonatype/actions release and can lag behind the current CLI
    default: '2.13.0-01'
    # type: string
  ignore_scanning_errors:
    description: 'Ignore scanning errors (invalid/inaccessible files)'
    required: false
    default: 'false'
    # type: boolean
  ignore_system_errors:
    description: 'Ignore system errors (IO, network, server, etc.)'
    required: false
    default: 'false'
    # type: boolean
  fail_on_policy_warnings:
    description: 'Fail the scan when policy evaluation warnings occur'
    required: false
    default: 'false'
    # type: boolean
  advanced_properties:
    description: >-
      System properties passed to the Nexus IQ CLI; accepts multiple
      key=value pairs, space-separated or one per line
    required: false
    default: ''
    # type: string
  application_id:
    description: 'Organisation and project name in Nexus IQ'
    required: false
    # yamllint disable-line rule:line-length
    default: "${{ github.repository_owner }}-${{ github.event.repository.name }}"
    # type: string
  scan_targets:
    description: 'Location of file(s) or folder(s) to scan'
    required: false
    default: '.'
    # type: string
  debug:
    description: 'Enable debugging output'
    required: false
    default: 'false'
    # type: boolean

runs:
  using: 'composite'
  steps:
    - name: 'Check action inputs/environment'
      shell: bash
      env:
        JAVA_DISTRIBUTION: ${{ inputs.java_distribution }}
        JAVA_VERSION: ${{ inputs.java_version }}
        IQ_CLI_VERSION: ${{ inputs.iq_cli_version }}
        APPLICATION_ID: ${{ inputs.application_id }}
        SCAN_TARGETS: ${{ inputs.scan_targets }}
        DEBUG: ${{ inputs.debug }}
        NEXUS_IQ_SERVER: ${{ inputs.nexus_iq_server }}
        NEXUS_IQ_USERNAME: ${{ inputs.nexus_iq_username }}
        NEXUS_IQ_PASSWORD: ${{ inputs.nexus_iq_password }}
      run: |
        # Check action inputs/environment
        echo "Java Distribution: $JAVA_DISTRIBUTION"
        echo "Java Version: $JAVA_VERSION"
        echo "IQ CLI Version: $IQ_CLI_VERSION"
        echo "Application ID: $APPLICATION_ID"
        echo "Scan Targets: $SCAN_TARGETS"
        echo "Debug Mode: $DEBUG"

        echo "Verifying mandatory inputs 💬"
        # Check mandatory parameters
        if [ -n "$NEXUS_IQ_SERVER" ]; then
          echo "Nexus IQ Server: $NEXUS_IQ_SERVER"
        else
          echo "Nexus IQ Server not provided as input"
          error='true'
        fi
        if [ -n "$NEXUS_IQ_USERNAME" ]; then
          echo "Nexus IQ Username: $NEXUS_IQ_USERNAME"
        else
          echo "Nexus IQ Username not provided as input"
          error='true'
        fi
        if [ -n "$NEXUS_IQ_PASSWORD" ]; then
          echo "Nexus IQ Password: [REDACTED]"
        else
          echo "Nexus IQ Password not provided as input"
          error='true'
        fi
        if [ "$error" = 'true' ]; then
          echo "Error: one or more mandatory inputs are missing"
          echo "Check variables/secrets are set in Org/repository"
          echo "Provide all required inputs to the action ❌"
          exit 1
        else
          echo "All mandatory inputs provided ✅"
        fi

    - name: 'Setup Sonatype CLI'
      # yamllint disable-line rule:line-length
      uses: sonatype/actions/setup-iq-cli@18335e91b476ad0f0a7c68bec3f1445e70d8f5fc # v1.14.0
      with:
        iq-cli-version: ${{ inputs.iq_cli_version }}

    # Sonatype CLI requires Java to run
    - name: 'Setup Java'
      # yamllint disable-line rule:line-length
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: ${{ inputs.java_distribution }}
        java-version: ${{ inputs.java_version }}

    - name: 'Checkout repository'
      # yamllint disable-line rule:line-length
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.no_checkout != 'true'
      with:
        persist-credentials: false

    - name: 'Debug action/environment'
      if: inputs.debug == 'true'
      shell: bash
      env:
        GITHUB_WORKSPACE_DIR: ${{ github.workspace }}
      run: |
        # Show local directory context
        echo "Debug logging enabled 🐞"
        echo "Current directory: $(pwd)"
        echo "GitHub workspace: $GITHUB_WORKSPACE_DIR"
        echo "Directory content:"
        ls -la

    - name: 'Run Sonatype CLI'
      # yamllint disable-line rule:line-length
      uses: sonatype/actions/run-iq-cli@207984d4ff92b2f2aee69821a233fa086080794e # v1.13.0
      with:
        iq-server-url: ${{ inputs.nexus_iq_server }}
        username: ${{ inputs.nexus_iq_username }}
        password: ${{ inputs.nexus_iq_password }}
        application-id: ${{ inputs.application_id }}
        scan-targets: ${{ inputs.scan_targets }}
        ignore-scanning-errors: ${{ inputs.ignore_scanning_errors }}
        ignore-system-errors: ${{ inputs.ignore_system_errors }}
        fail-on-policy-warnings: ${{ inputs.fail_on_policy_warnings }}
        advanced-properties: ${{ inputs.advanced_properties }}
        debug: ${{ inputs.debug }}
