---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# sonatype-lifecycle-scan-action
name: '🔐 Sonatype Lifecycle Scan'
description: 'Runs a Sonatype Lifecycle (Nexus IQ) scan'

inputs:
  # Note: types are not enforced for composite actions and fail schema checks
  # But are useful for documentation purposes and will be commented out

  # Mandatory
  nexus_iq_server:
    description: 'Nexus IQ Server URL'
    required: true
    # type: string
  nexus_iq_username:
    description: 'Nexus IQ Username'
    required: true
    # type: string
  nexus_iq_password:
    description: 'Nexus IQ Password'
    required: true
    # type: string

  # Optional
  no_checkout:
    description: 'Do not checkout local repository; used for testing'
    required: false
    default: 'false'
    # type: boolean
  java_distribution:
    description: 'JAVA SE distribution to setup/run for Nexus CLI tool'
    required: false
    default: 'temurin'
    # type: string
  java_version:
    description: 'Java runtime to setup/run for Nexus CLI tool'
    required: false
    default: '17'
    # type: number
  iq_cli_version:
    description: 'Specific version of Nexus CLI to setup/run'
    required: false
    # Note: the 'latest' alias resolves to the version embedded in the
    # sonatype/actions release and can lag behind the current CLI
    default: '2.13.0-01'
    # type: string
  ignore_scanning_errors:
    description: 'Ignore scanning errors (invalid/inaccessible files)'
    required: false
    default: 'false'
    # type: boolean
  ignore_system_errors:
    description: 'Ignore system errors (IO, network, server, etc.)'
    required: false
    default: 'false'
    # type: boolean
  fail_on_policy_warnings:
    description: 'Fail the scan when policy evaluation warnings occur'
    required: false
    default: 'false'
    # type: boolean
  advanced_properties:
    description: >-
      System properties passed to the Nexus IQ CLI; accepts multiple
      key=value pairs, space-separated or one per line. References to
      GITHUB_WORKSPACE, GITHUB_REPOSITORY, GITHUB_REF_NAME, GITHUB_SHA,
      GITHUB_RUN_ID, RUNNER_TEMP or RUNNER_OS expand before the CLI
      runs; every other ${...} reaches the CLI as written
    required: false
    default: ''
    # type: string
  application_id:
    description: 'Organisation and project name in Nexus IQ'
    required: false
    # yamllint disable-line rule:line-length
    default: "${{ github.repository_owner }}-${{ github.event.repository.name }}"
    # type: string
  scan_targets:
    description: >-
      Location of file(s) or folder(s) to scan. Workspace variable
      references expand the same way as in advanced_properties; see
      that input's description
    required: false
    default: '.'
    # type: string
  summary:
    description: >-
      What to write to the job summary: 'outcome' (the outcome table
      alone), 'full' (outcome, component count, alerts per threat band
      and the highest-threat alerts; uploads the result as an artifact,
      and a failed upload fails the scan) or 'none'
    required: false
    default: 'outcome'
    # type: string
  debug:
    description: 'Enable debugging output'
    required: false
    default: 'false'
    # type: boolean

outputs:
  scan_id:
    description: 'ID of the scan; set only when the CLI produced a result'
    value: ${{ steps.scan.outputs.scan-id }}
  report_url:
    description: 'URL of the IQ policy evaluation report'
    value: ${{ steps.scan.outputs.report-url }}
  priorities_url:
    description: 'URL of the IQ application priorities, where returned'
    value: ${{ steps.scan.outputs.priorities-url }}
  cli_exit_code:
    description: 'Exit code of the Nexus IQ CLI'
    value: ${{ steps.scan.outputs.cli-exit-code }}
  cli_exit_category:
    description: 'Exit category of the Nexus IQ CLI, e.g. POLICY_VIOLATION'
    value: ${{ steps.scan.outputs.cli-exit-category }}
  cli_exit_message:
    description: 'Exit message of the Nexus IQ CLI'
    value: ${{ steps.scan.outputs.cli-exit-message }}

runs:
  using: 'composite'
  steps:
    - name: 'Check action inputs/environment'
      shell: bash
      env:
        JAVA_DISTRIBUTION: ${{ inputs.java_distribution }}
        JAVA_VERSION: ${{ inputs.java_version }}
        IQ_CLI_VERSION: ${{ inputs.iq_cli_version }}
        APPLICATION_ID: ${{ inputs.application_id }}
        SCAN_TARGETS: ${{ inputs.scan_targets }}
        SUMMARY: ${{ inputs.summary }}
        DEBUG: ${{ inputs.debug }}
        NEXUS_IQ_SERVER: ${{ inputs.nexus_iq_server }}
        NEXUS_IQ_USERNAME: ${{ inputs.nexus_iq_username }}
        NEXUS_IQ_PASSWORD: ${{ inputs.nexus_iq_password }}
      run: |
        # Check action inputs/environment
        echo "Java Distribution: $JAVA_DISTRIBUTION"
        echo "Java Version: $JAVA_VERSION"
        echo "IQ CLI Version: $IQ_CLI_VERSION"
        echo "Application ID: $APPLICATION_ID"
        echo "Scan Targets: $SCAN_TARGETS"
        echo "Job Summary: $SUMMARY"
        echo "Debug Mode: $DEBUG"

        echo "Verifying mandatory inputs 💬"
        # Check mandatory parameters
        if [ -n "$NEXUS_IQ_SERVER" ]; then
          echo "Nexus IQ Server: $NEXUS_IQ_SERVER"
        else
          echo "Nexus IQ Server not provided as input"
          error='true'
        fi
        if [ -n "$NEXUS_IQ_USERNAME" ]; then
          echo "Nexus IQ Username: $NEXUS_IQ_USERNAME"
        else
          echo "Nexus IQ Username not provided as input"
          error='true'
        fi
        if [ -n "$NEXUS_IQ_PASSWORD" ]; then
          echo "Nexus IQ Password: [REDACTED]"
        else
          echo "Nexus IQ Password not provided as input"
          error='true'
        fi
        case "$SUMMARY" in
          outcome | full | none) ;;
          *)
            echo "Invalid summary: expected outcome, full or none"
            error='true'
            ;;
        esac
        if [ "$error" = 'true' ]; then
          echo "Error: one or more inputs are missing or invalid"
          echo "Check variables/secrets are set in Org/repository"
          echo "Provide all required inputs to the action ❌"
          exit 1
        else
          echo "All mandatory inputs provided ✅"
        fi

    - name: 'Setup Sonatype CLI'
      # yamllint disable-line rule:line-length
      uses: sonatype/actions/setup-iq-cli@8c4abefc47a5f0f8dd124f0bb60e48aafec7b2de # v1.16.0
      with:
        iq-cli-version: ${{ inputs.iq_cli_version }}

    # Sonatype CLI requires Java to run
    - name: 'Setup Java'
      # yamllint disable-line rule:line-length
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: ${{ inputs.java_distribution }}
        java-version: ${{ inputs.java_version }}

    - name: 'Checkout repository'
      # yamllint disable-line rule:line-length
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.no_checkout != 'true'
      with:
        persist-credentials: false

    - name: 'Debug action/environment'
      if: inputs.debug == 'true'
      shell: bash
      env:
        GITHUB_WORKSPACE_DIR: ${{ github.workspace }}
      run: |
        # Show local directory context
        echo "Debug logging enabled 🐞"
        echo "Current directory: $(pwd)"
        echo "GitHub workspace: $GITHUB_WORKSPACE_DIR"
        echo "Directory content:"
        ls -la

    - name: 'Expand workspace variables'
      id: expand
      shell: bash
      env:
        ADVANCED_PROPERTIES: ${{ inputs.advanced_properties }}
        SCAN_TARGETS: ${{ inputs.scan_targets }}
      run: |
        # Expand workspace variable references in the CLI inputs
        set -euo pipefail
        # Jenkins expanded $WORKSPACE in a shell before the CLI started;
        # nothing on this path re-expands ${...} inside an input value,
        # so restore that pass here with the same allowlisted expansion
        # maven-build-action and sonarqube-cloud-scan-action apply to
        # their argument inputs. Nothing in it executes: $(...),
        # backticks and $((...)) reach the CLI as written, and names
        # outside the allowlist stay literal, credentials among them.
        # shellcheck source=expand-workspace-vars.sh
        . "$GITHUB_ACTION_PATH/expand-workspace-vars.sh"
        # Both inputs accept several whitespace-separated values, so an
        # allowlisted name resolving to a path carrying whitespace
        # splits one value into two wherever it lands. A runner with
        # such a workspace path cannot express the value at all; name
        # the problem rather than let the CLI fail on a mangled path.
        # Matching uses the same reference forms the expansion consumes
        # -- ${NAME} exactly, or $NAME at an identifier boundary -- so
        # literal text such as label=GITHUB_WORKSPACE, or a distinct
        # name sharing the prefix, draws no warning.
        for _name in GITHUB_WORKSPACE GITHUB_REPOSITORY GITHUB_REF_NAME \
          GITHUB_SHA GITHUB_RUN_ID RUNNER_TEMP RUNNER_OS; do
          # Joined with a newline: the inputs expand independently, so a
          # reference ending one must not run into the start of the
          # other and read as a longer identifier.
          _both="$ADVANCED_PROPERTIES"$'\n'"$SCAN_TARGETS"
          if [[ "$_both" == *"\${$_name}"* ]] \
            || [[ "$_both" =~ \$$_name([^A-Za-z0-9_]|$) ]]; then
            case "${!_name-}" in
              *[[:space:]]*)
                echo "::warning::$_name holds whitespace, so a value" \
                  "built from it splits into more than one value." \
                  "Use a path without whitespace."
                ;;
            esac
          fi
        done
        ADVANCED_PROPERTIES="$(expand_workspace_vars "$ADVANCED_PROPERTIES")"
        SCAN_TARGETS="$(expand_workspace_vars "$SCAN_TARGETS")"
        # advanced_properties accepts one pair per line, so use the
        # multiline (delimiter) output form; a newline in the value must
        # not break the output file or inject extra outputs. printf
        # rather than echo for the values: echo reads option-shaped
        # values such as '-n' as its own flags and mangles them.
        DELIM="EXPAND_EOF_${RANDOM}${RANDOM}"
        {
          printf '%s\n' "advanced_properties<<${DELIM}"
          printf '%s\n' "$ADVANCED_PROPERTIES"
          printf '%s\n' "${DELIM}"
          printf '%s\n' "scan_targets<<${DELIM}"
          printf '%s\n' "$SCAN_TARGETS"
          printf '%s\n' "${DELIM}"
        } >> "$GITHUB_OUTPUT"

    # run-iq-cli deletes the CLI's result file before its step ends, so
    # the only way a later step can read it is the artifact run-iq-cli
    # uploads when given a name. A clash with another upload in the run
    # fails that upload and with it the scan, so the name carries the
    # run, the attempt, the job and a random part: two jobs of one run,
    # matrix legs, reusable-workflow calls and two calls in one job all
    # differ.
    - name: 'Name the scan result artifact'
      id: artifact
      if: inputs.summary == 'full'
      # Failing here leaves the name empty: the scan runs without the
      # artifact and the summary says the details are unavailable.
      continue-on-error: true
      shell: bash
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        JOB_ID: ${{ github.job }}
        TEMP_DIR: ${{ runner.temp }}
      run: |
        # Name the scan result artifact
        set -euo pipefail
        rand="$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        # run-iq-cli accepts only ^[.a-zA-Z0-9_-]*$
        job="$(printf '%s' "$JOB_ID" | tr -c 'a-zA-Z0-9_-' '_' | cut -c1-60)"
        name="sonatype-iq-result-${RUN_ID}-${RUN_ATTEMPT}-${job}-${rand}"
        {
          printf 'name=%s\n' "$name"
          printf 'dir=%s\n' "${TEMP_DIR}/${name}"
        } >> "$GITHUB_OUTPUT"

    - name: 'Run Sonatype CLI'
      id: scan
      # yamllint disable-line rule:line-length
      uses: sonatype/actions/run-iq-cli@8c4abefc47a5f0f8dd124f0bb60e48aafec7b2de # v1.16.0
      with:
        iq-server-url: ${{ inputs.nexus_iq_server }}
        username: ${{ inputs.nexus_iq_username }}
        password: ${{ inputs.nexus_iq_password }}
        application-id: ${{ inputs.application_id }}
        scan-targets: ${{ steps.expand.outputs.scan_targets }}
        ignore-scanning-errors: ${{ inputs.ignore_scanning_errors }}
        ignore-system-errors: ${{ inputs.ignore_system_errors }}
        fail-on-policy-warnings: ${{ inputs.fail_on_policy_warnings }}
        advanced-properties: ${{ steps.expand.outputs.advanced_properties }}
        # Empty unless summary is 'full': no artifact is uploaded then
        result-file: ${{ steps.artifact.outputs.name }}
        debug: ${{ inputs.debug }}

    # The summary steps report the scan and never change its result:
    # they run whether the scan passed or failed, and neither can fail
    # the action. They receive no credentials.
    - name: 'Download scan result'
      id: download
      if: >-
        !cancelled() && inputs.summary == 'full'
        && steps.scan.outcome != 'skipped'
        && steps.artifact.outputs.name != ''
      continue-on-error: true
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ steps.artifact.outputs.dir }}

    - name: 'Write job summary'
      if: >-
        !cancelled() && inputs.summary != 'none'
        && steps.scan.outcome != 'skipped'
      continue-on-error: true
      shell: bash
      env:
        SUMMARY_MODE: ${{ inputs.summary }}
        APPLICATION_ID: ${{ inputs.application_id }}
        CLI_EXIT_CATEGORY: ${{ steps.scan.outputs.cli-exit-category }}
        CLI_EXIT_MESSAGE: ${{ steps.scan.outputs.cli-exit-message }}
        SCAN_ID: ${{ steps.scan.outputs.scan-id }}
        RESULT_DOWNLOAD: ${{ steps.download.outcome }}
        RESULT_DIR: ${{ steps.artifact.outputs.dir }}
      run: |
        # Write job summary
        bash "$GITHUB_ACTION_PATH/write-scan-summary.sh"
